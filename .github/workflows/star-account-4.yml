name: Star repos - Account 3

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"   # 9:00 PM

jobs:
  star-repos:
    runs-on: ubuntu-latest

    env:
      TOKEN: ${{ secrets.STAR_TOKEN_3 }}
      REPO_FILE: repos_to_star_3.txt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Star repos
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "${REPO_FILE}" ]; then
            echo "::warning::${REPO_FILE} not found"
            exit 0
          fi

          while IFS= read -r repo; do
            [ -z "$repo" ] && continue

            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "DRY RUN: would star $repo"
              continue
            fi

            echo "Checking $repo"

            status=$(curl -sS -o /tmp/repo_check.out -w "%{http_code}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}")

            if [ "$status" = "404" ]; then
              echo "Skipping missing/inaccessible repo: $repo"
              continue
            fi

            if [ "$status" != "200" ] && [ "$status" != "204" ]; then
              echo "Unexpected repo status for $repo: $status"
              cat /tmp/repo_check.out
              exit 1
            fi

            echo "Starring $repo"
            star_status=$(curl -sS -o /tmp/star_result.out -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/starred/${repo}")

            if [ "$star_status" = "204" ]; then
              echo "Starred $repo"
            elif [ "$star_status" = "404" ]; then
              echo "Skipping missing/inaccessible repo during star: $repo"
            elif [ "$star_status" != "200" ]; then
              echo "Failed to star $repo: HTTP $star_status"
              cat /tmp/star_result.out
              exit 1
            fi

          done < "${REPO_FILE}"
